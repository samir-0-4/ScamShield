spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/phantomtrace}
    username: ${POSTGRES_USER:phantomtrace_user}
    password: ${POSTGRES_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

phantomtrace:
  security:
    jwt:
      secret: ${JWT_SECRET:}

logging:
  level:
    root: INFO
    com.phantomtrace: DEBUG
    org.springframework.security: INFO
